<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMINI NETWORK - امینی نتورک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-main: #02050d;
            --bg-card: rgba(7, 14, 28, 0.72);
            --blue: #008cff;
            --blue-light: #19c8ff;
            --blue-deep: #1455ff;
            --white: #ffffff;
            --text-main: #f5f9ff;
            --text-muted: #8b9ab3;
            --border: rgba(75, 150, 255, 0.13);
            --border-blue: rgba(25, 200, 255, 0.45);
            --glow: 0 0 25px rgba(0, 140, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -10%, rgba(0, 140, 255, 0.17), transparent 35%), var(--bg-main);
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Alignment */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--glow);
        }

        .logo img {
            height: 38px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--blue-light);
        }

        .nav-btn {
            background: rgba(0, 140, 255, 0.1);
            border: 1px solid var(--border-blue);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: var(--blue);
            box-shadow: 0 0 15px rgba(0, 140, 255, 0.5);
        }

        /* Hero Banner */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 50px;
            min-height: 420px;
            box-shadow: var(--glow);
            gap: 30px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            flex: 1;
            text-align: right;
            z-index: 3;
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--blue-light);
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .hero-title span {
            background: linear-gradient(135deg, var(--blue-light), var(--blue-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--blue), var(--blue-deep));
            color: var(--white);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.3);
            transition: 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(25, 200, 255, 0.6);
        }

        /* لایه افکت متحرک اتصالات شبکه روی کره زمین */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-visual img {
            max-width: 100%;
            max-height: 360px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(0, 140, 255, 0.4));
            position: relative;
            z-index: 1;
        }

        /* موج راداری و اسکن نوری شبکه */
        .network-overlay {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(25, 200, 255, 0.25) 60deg, transparent 90deg);
            animation: networkSweep 6s linear infinite;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* پالس‌های نوری نقطه اتصال */
        .network-pulse {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(25, 200, 255, 0.5), inset 0 0 30px rgba(0, 140, 255, 0.3);
            animation: pulseSignal 3s ease-in-out infinite alternate;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes networkSweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseSignal {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        @media (max-width: 850px) {
            .nav-links { display: none; }
            .hero { flex-direction: column-reverse; text-align: center; padding: 30px 20px; }
            .hero-content { text-align: center; }
            .hero-visual img { max-height: 220px; }
            .network-overlay, .network-pulse { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر بالای سایت -->
        <header>
            <div class="logo">
                <img src="logo.png.png" alt="AMINI NETWORK">
            </div>
            
            <ul class="nav-links">
                <li><a href="#" class="active">خانه</a></li>
                <li><a href="#">سرویس‌ها</a></li>
                <li><a href="#">قیمت‌ها</a></li>
                <li><a href="#">پشتیبانی</a></li>
                <li><a href="#">درباره ما</a></li>
            </ul>

            <button class="nav-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">پشتیبانی تلگرام</button>
        </header>

        <!-- بنر اصلی همراه با انیمیشن اتصالات نوری -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-subtitle">اتصال پایدار، سرعت بی‌نهایت</div>
                <h1 class="hero-title">امینی <span>نتورک</span></h1>
                <p class="hero-desc">تجربه‌ی اینترنتی متفاوت با سرورهای اختصاصی و پرسرعت</p>
                <button class="cta-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">🚀 شروع کنید</button>
            </div>

            <div class="hero-visual">
                <img src="header.png.png" alt="Amini Network Banner">
                <div class="network-overlay"></div>
                <div class="network-pulse"></div>
            </div>
        </section>
    </div>

</body>
</html>
