<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMINI NETWORK - امینی نتورک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-main: #02050d;
            --bg-card: rgba(7, 14, 28, 0.75);
            --blue: #008cff;
            --blue-light: #19c8ff;
            --blue-deep: #1455ff;
            --white: #ffffff;
            --text-main: #f5f9ff;
            --text-muted: #8b9ab3;
            --border: rgba(75, 150, 255, 0.18);
            --border-blue: rgba(25, 200, 255, 0.45);
            --glow: 0 0 25px rgba(0, 140, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -10%, rgba(0, 140, 255, 0.17), transparent 40%), var(--bg-main);
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: var(--glow);
        }

        .logo img {
            height: 38px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--blue-light);
        }

        .nav-btn {
            background: rgba(0, 140, 255, 0.1);
            border: 1px solid var(--border-blue);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: var(--blue);
            box-shadow: 0 0 15px rgba(0, 140, 255, 0.5);
        }

        /* Hero Banner */
        .hero {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            min-height: 440px;
            box-shadow: var(--glow);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 480px;
            z-index: 5;
            position: relative;
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--blue-light);
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .hero-title span {
            background: linear-gradient(135deg, var(--blue-light), var(--blue-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--blue), var(--blue-deep));
            color: var(--white);
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.3);
            transition: 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(25, 200, 255, 0.6);
        }

        /* Background Image & Live Dynamic Animation Layer */
        .hero-bg-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .hero-bg-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0.85;
            filter: brightness(1.1);
        }

        /* انیمیشن گذر موج نوری اتصالات روی خطوط */
        .light-sweep {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(25, 200, 255, 0.15) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: sweep 4s infinite ease-in-out;
            z-index: 2;
            pointer-events: none;
        }

        /* انیمیشن پالس زنده در مرکز کره زمین */
        .globe-glow {
            position: absolute;
            right: 15%;
            top: 30%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25, 200, 255, 0.3) 0%, transparent 70%);
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { left: -100%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.9; }
        }

        @media (max-width: 850px) {
            .nav-links { display: none; }
            .hero { text-align: center; justify-content: center; padding: 40px 20px; }
            .hero-content { max-width: 100%; }
            .hero-bg-wrapper img { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر بالای سایت -->
        <header>
            <div class="logo">
                <img src="logo.png" alt="AMINI NETWORK">
            </div>
            
            <ul class="nav-links">
                <li><a href="#" class="active">خانه</a></li>
                <li><a href="#">سرویس‌ها</a></li>
                <li><a href="#">قیمت‌ها</a></li>
                <li><a href="#">پشتیبانی</a></li>
                <li><a href="#">درباره ما</a></li>
            </ul>

            <button class="nav-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">پشتیبانی تلگرام</button>
        </header>

        <!-- بنر لایو با عکس جدید و انیمیشن اتصالات زنده -->
        <section class="hero">
            <div class="hero-bg-wrapper">
                <img src="header.png.png" alt="Amini Network Live Connections">
                <div class="light-sweep"></div>
                <div class="globe-glow"></div>
            </div>

            <div class="hero-content">
                <div class="hero-subtitle">اتصال پایدار، سرعت بی‌نهایت</div>
                <h1 class="hero-title">امینی <span>نتورک</span></h1>
                <p class="hero-desc">تجربه‌ی اینترنتی متفاوت با سرورهای اختصاصی و پرسرعت</p>
                <button class="cta-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">🚀 شروع کنید</button>
            </div>
        </section>
    </div>

</body>
</html>
