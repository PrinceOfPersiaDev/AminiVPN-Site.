<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMINI NETWORK - امینی نتورک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: rgba(13, 22, 41, 0.7);
            --primary-blue: #0088ff;
            --glow-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: rgba(0, 136, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 30%, #0a1936 0%, #050811 70%);
            min-height: 100vh;
        }

        /* Container & Glassmorphism Header/Hero */
        .wrapper {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10, 18, 36, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .logo img {
            height: 36px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--glow-blue);
        }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.2);
        }

        .auth-btn:hover {
            background: var(--primary-blue);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.6);
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 18, 36, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 50px;
            position: relative;
            overflow: hidden;
            min-height: 420px;
        }

        .hero-content {
            max-width: 50%;
            z-index: 2;
        }

        .hero-subtitle {
            font-size: 18px;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .hero-title span {
            color: var(--primary-blue);
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .cta-btn {
            background: linear-gradient(135deg, #0077ff, #00d2ff);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.7);
        }

        /* Hero Image/Glow */
        .hero-visual {
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 55%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .hero-visual img {
            width: 100%;
            max-width: 550px;
            filter: drop-shadow(0 0 35px rgba(0, 136, 255, 0.5));
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero { flex-direction: column; text-align: center; padding: 30px 20px; }
            .hero-content { max-width: 100%; }
            .hero-visual { position: relative; left: 0; transform: none; width: 100%; margin-top: 30px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="logo.png.png" alt="AMINI NETWORK">
            </div>
            
            <ul class="nav-links">
                <li><a href="#" class="active">خانه</a></li>
                <li><a href="#">سرویس‌ها</a></li>
                <li><a href="#">قیمت‌ها</a></li>
                <li><a href="#">پشتیبانی</a></li>
                <li><a href="#">درباره ما</a></li>
            </ul>

            <button class="auth-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                ورود / ثبت‌نام
            </button>
        </header>

        <!-- Hero Banner -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-subtitle">اتصال پایدار، سرعت بی‌نهایت</div>
                <h1 class="hero-title">امینی <span>نتورک</span></h1>
                <p class="hero-desc">تجربه‌ی اینترنتی متفاوت با سرورهای اختصاصی و پرسرعت</p>
                <button class="cta-btn" onclick="window.open('https://t.me/AminiVPN_bot', '_blank')">
                    🚀 شروع کنید
                </button>
            </div>

            <div class="hero-visual">
                <img src="logo.png.png" alt="Amini Network Graphic">
            </div>
        </section>
    </div>

</body>
</html>
